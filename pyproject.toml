[project]
name = "bolt-python-getting-started-app"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "slack-bolt==1.30.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 125
exclude = [".venv", "venv"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
